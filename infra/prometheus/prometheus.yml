global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:8000']
  - job_name: normalizer
    static_configs:
      - targets: ['normalizer:9101']
  - job_name: raw-archive
    static_configs:
      - targets: ['raw-archive:9102']
  - job_name: operator-journey
    static_configs:
      - targets: ['journey-probe:9101']
