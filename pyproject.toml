[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-traffic"
version = "0.3.0"
description = "Replayable traffic stream processing and point-in-time forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.112,<1",
    "prometheus-client>=0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "structlog>=24,<26",
    "uvicorn[standard]>=0.30,<1",
]
ingestion = [
    "confluent-kafka>=2.5,<3",
    "feedparser>=6,<7",
    "requests>=2.32,<3",
    "structlog>=24,<26",
]
streaming = [
    "boto3>=1.34,<2",
    "confluent-kafka>=2.5,<3",
    "prometheus-client>=0.20,<1",
    "pyarrow>=17,<20",
]
ml = [
    "boto3>=1.34,<2",
    "joblib>=1.4,<2",
    "lightgbm>=4.5,<5",
    "mlflow==2.16.2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<20",
    "scikit-learn==1.6.1",
]
flink = ["apache-flink==1.20.2"]
orchestration = ["apache-airflow==2.10.5"]
dev = [
    "boto3>=1.34,<2",
    "confluent-kafka>=2.5,<3",
    "fastapi>=0.112,<1",
    "feedparser>=6,<7",
    "joblib>=1.4,<2",
    "lightgbm>=4.5,<5",
    "mlflow==2.16.2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "prometheus-client>=0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=17,<20",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "redis>=5,<7",
    "requests>=2.32,<3",
    "ruff>=0.9,<1",
    "scikit-learn==1.6.1",
    "structlog>=24,<26",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
traffic-ingest = "cognitive_traffic.ingestion.traffic:run"
weather-ingest = "cognitive_traffic.ingestion.weather:run"
news-ingest = "cognitive_traffic.ingestion.news:run"
traffic-stream = "cognitive_traffic.streaming.processors:main"
traffic-replay = "cognitive_traffic.streaming.replay:main"
traffic-forecast = "cognitive_traffic.forecasting.inference:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/cognitive_traffic/api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
