name: cognitive-traffic

x-s3-environment: &s3-environment
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000

x-flink-environment: &flink-environment
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    rest.address: flink-jobmanager
    rest.bind-address: 0.0.0.0
    taskmanager.numberOfTaskSlots: 6
    parallelism.default: 6
    state.checkpoints.dir: s3://cognitive-traffic/checkpoints/flink
    s3.endpoint: http://minio:9000
    s3.path.style.access: true
    s3.connection.ssl.enabled: false
    s3.access-key: ${S3_ACCESS_KEY:-minioadmin}
    s3.secret-key: ${S3_SECRET_KEY:-minioadmin}

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    command: ["bash", "/create-topics.sh", "kafka:29092"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address :9001
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" && mc mb --ignore-existing local/cognitive-traffic
    restart: "no"

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: traffic_analytics
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/10-traffic-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d traffic_analytics"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  mlflow:
    build:
      context: .
      dockerfile: infra/docker/mlflow.Dockerfile
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      <<: *s3-environment
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mlflow
      - --artifacts-destination
      - s3://cognitive-traffic/artifacts/mlflow
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"

  raw-archive:
    build:
      context: .
      dockerfile: infra/docker/streaming.Dockerfile
    command: python -m cognitive_traffic.streaming.processors archive
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      METRICS_PORT: "9102"
      OBJECT_STORE_URI: s3://cognitive-traffic
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    expose: ["9102"]

  normalizer:
    build:
      context: .
      dockerfile: infra/docker/streaming.Dockerfile
    command: python -m cognitive_traffic.streaming.processors normalize
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      METRICS_PORT: "9101"
    expose: ["9101"]

  traffic-ingestor:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: infra/docker/streaming.Dockerfile
      args:
        PROJECT_EXTRAS: ingestion
    command: python -m cognitive_traffic.ingestion.traffic
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      TOMTOM_POLL_INTERVAL_SECONDS: ${TOMTOM_POLL_INTERVAL_SECONDS:-300}

  weather-ingestor:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: infra/docker/streaming.Dockerfile
      args:
        PROJECT_EXTRAS: ingestion
    command: python -m cognitive_traffic.ingestion.weather
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      WEATHER_POLL_INTERVAL_SECONDS: ${WEATHER_POLL_INTERVAL_SECONDS:-900}

  news-ingestor:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: infra/docker/streaming.Dockerfile
      args:
        PROJECT_EXTRAS: ingestion
    command: python -m cognitive_traffic.ingestion.news
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEWS_POLL_INTERVAL_SECONDS: ${NEWS_POLL_INTERVAL_SECONDS:-600}

  forecast-service:
    profiles: ["inference"]
    build:
      context: .
      dockerfile: infra/docker/streaming.Dockerfile
      args:
        PROJECT_EXTRAS: streaming,ml
    command: python -m cognitive_traffic.forecasting.inference
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OBJECT_STORE_URI: s3://cognitive-traffic
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MODEL_ARTIFACT_KEY: ${MODEL_ARTIFACT_KEY:-}
      MODEL_VERSION: ${MODEL_VERSION:-}

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/traffic_analytics
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OBJECT_STORE_URI: s3://cognitive-traffic
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}

  flink-jobmanager:
    profiles: ["streaming"]
    build:
      context: .
      dockerfile: infra/docker/flink.Dockerfile
    command: jobmanager
    ports: ["8081:8081"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    environment:
      <<: *flink-environment
    volumes:
      - ./tests/streaming/flink_smoke.sql:/opt/flink/smoke/flink_smoke.sql:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  flink-taskmanager:
    profiles: ["streaming"]
    build:
      context: .
      dockerfile: infra/docker/flink.Dockerfile
    command: taskmanager
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    environment:
      <<: *flink-environment
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://flink-jobmanager:8081/taskmanagers | grep --quiet '"taskmanagers":\[{'
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: infra/docker/airflow.Dockerfile
    profiles: ["orchestration"]
    ports: ["8088:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: standalone
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["monitoring"]
    ports: ["9090:9090"]
    depends_on:
      api: {condition: service_started}
      normalizer: {condition: service_started}
      raw-archive: {condition: service_started}
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    profiles: ["dashboard"]
    working_dir: /app/frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes: [".:/app"]
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"

volumes:
  airflow_logs:
  postgres_data:
  prometheus_data:
  redis_data:
  minio_data:
