global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: normalizer
    static_configs:
      - targets: ["normalizer:9101"]

  - job_name: raw-archive
    static_configs:
      - targets: ["raw-archive:9102"]
