name: ci-light

on:
  push:
  pull_request:

jobs:
  python-frontend-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Compile production packages
        run: python -m compileall -q src orchestration
      - name: Python lint
        run: ruff check src tests orchestration
      - name: Python tests
        run: pytest
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
