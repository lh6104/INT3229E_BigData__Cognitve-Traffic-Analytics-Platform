route:
  receiver: oncall
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 5m
receivers:
  - name: oncall
    webhook_configs:
      - url: http://oncall:8095/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /state/token
